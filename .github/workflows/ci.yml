name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install com
        run: npm ci
        working-directory: com
      - name: Install api
        run: npm ci
        working-directory: api
      - name: Install app
        run: npm ci
        working-directory: app

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install com
        run: npm ci
        working-directory: com
      - name: Install app
        run: npm ci
        working-directory: app
      - name: Lint frontend
        run: npm run lint
        working-directory: app

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install com
        run: npm ci
        working-directory: com
      - name: Install api
        run: npm ci
        working-directory: api
      - name: Install app
        run: npm ci
        working-directory: app
      - name: Typecheck API
        run: npm run typecheck
        working-directory: api
      - name: Typecheck frontend
        run: npx tsc --noEmit
        working-directory: app

  build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install com
        run: npm ci
        working-directory: com
      - name: Install app
        run: npm ci
        working-directory: app
      - name: Build frontend
        run: npm run build
        working-directory: app

  vitest:
    needs: install
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install api
        run: npm ci
        working-directory: api
      - name: Wait for MongoDB
        run: sleep 5
      - name: Run Vitest
        run: npm test
        working-directory: api
        env:
          SPEC_MONGO_URL: mongodb://127.0.0.1:27017/vegazetas_disposable
          JWT_SECRET: ci-test-secret

  playwright:
    needs: install
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install com
        run: npm ci
        working-directory: com
      - name: Install app
        run: npm ci
        working-directory: app
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: app
      - name: Wait for MongoDB
        run: sleep 5
      - name: Run Playwright
        run: npm run test:e2e
        working-directory: app
        env:
          E2E_MONGO_URL: mongodb://127.0.0.1:27017/vegazetas_e2e_disposable
          JWT_SECRET: ci-test-secret
